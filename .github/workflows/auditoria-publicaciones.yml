name: auditoria-publicaciones
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Herramienta oficial de Android
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          echo "APKSIGNER=$ANDROID_HOME/build-tools/35.0.0/apksigner" >> "$GITHUB_ENV"
      - name: Verificar bytes, sumas y firmas de todos los APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_PUBLIC_CERTIFICATES: "f03505ce861af5ddbf1a2c31fe308a5d7ae822c40689cf5893a8263b81232fb3"
          AUDIT_OUTPUT: ${{ runner.temp }}/auditoria-releases.json
        run: python .github/scripts/auditar_releases.py
      - name: Guardar resultados sin secretos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-publicaciones
          path: ${{ runner.temp }}/auditoria-releases.json
          if-no-files-found: error
