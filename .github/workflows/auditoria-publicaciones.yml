name: auditoria-publicaciones
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Huella aprobada, leída del repo
        run: |
          # La huella vive en entorno/HUELLA-CERTIFICADO.txt: el flujo que
          # construye el APK y el que audita lo publicado leen el mismo fichero.
          # Antes estaba escrita a mano aquí y valía la del certificado que se
          # perdió, así que toda build nueva habría salido «no aprobada» sin que
          # nadie se enterara de por qué.
          echo "APPROVED_PUBLIC_CERTIFICATES=$(cat entorno/HUELLA-CERTIFICADO.txt)" >> "$GITHUB_ENV"

      - name: Herramienta oficial de Android
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          echo "APKSIGNER=$ANDROID_HOME/build-tools/35.0.0/apksigner" >> "$GITHUB_ENV"
      - name: Verificar bytes, sumas y firmas de todos los APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_OUTPUT: ${{ runner.temp }}/auditoria-releases.json
        run: python .github/scripts/auditar_releases.py
      - name: Guardar resultados sin secretos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-publicaciones
          path: ${{ runner.temp }}/auditoria-releases.json
          if-no-files-found: error
