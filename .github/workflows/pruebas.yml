name: pruebas

# La app no tenía ninguna corrida de CI: 386 pruebas y nadie las ejecutaba salvo a mano.
#
# Lo que este flujo demuestra y lo que no:
#   · Compila y ejecuta las 386 pruebas en una máquina limpia, sin /opt/robolectric y
#     sin los modelos de 373 MiB. Robolectric baja su propio runtime y las tres pruebas
#     que necesitan los modelos se SALTAN, no fallan: se distinguen los dos casos.
#   · NO construye el APK: empaquetar 373 MiB de modelos y firmarlo pide claves que no
#     están en el repositorio. Eso se hace a mano y está en entorno/COMPILAR-Y-FIRMAR.md.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/pruebas.yml"
  pull_request:
  workflow_dispatch:

jobs:
  unitarias:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Compilar
        working-directory: android
        run: gradle :app:compileDebugKotlin --console=plain

      - name: Ejecutar las pruebas
        working-directory: android
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Resumen de resultados
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("android/app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"{t} pruebas · {f} fallos · {e} errores · {s} saltadas")
          PY

      - name: Guardar los resultados si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: android/app/build/reports/tests/testDebugUnitTest/
