name: metadatos-python
on:
  push:
    paths: ["requirements.txt", ".github/workflows/metadatos-python.yml"]
  pull_request:
    paths: ["requirements.txt", ".github/workflows/metadatos-python.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  requisitos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar requisitos resolubles sin instalar la app
        run: python -m pip install --dry-run --no-deps -r requirements.txt
