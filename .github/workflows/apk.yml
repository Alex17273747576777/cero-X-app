name: apk

# El APK firmado, construido por el repo y no a mano en una máquina.
#
# Por qué existe: la build 1.0.0-beta se firmó con un certificado que después no
# apareció por ninguna parte (huella f03505ce…). Sin ese keystore no se puede
# actualizar una instalación existente y nadie podía volver a construir el APK.
# Este flujo lo hace reproducible: la clave vive en los secretos del repo
# (CEROX_KEYSTORE_B64 y compañía) y su huella pública en
# entorno/HUELLA-CERTIFICADO.txt, que es el mismo fichero que lee la auditoría.
#
# Lo que construye y lo que no:
#   · Release con R8, UNA arquitectura (-PsoloAbi, por defecto arm64-v8a: la del
#     V60 ThinQ 5G) y SIN modelos (-PsinModelos). Los ONNX pesan 378 MiB y no van
#     dentro: eso es lo que convirtió el APK anterior en 475 MB. El flujo lo
#     comprueba contando los .onnx del ZIP y falla si hay alguno.
#   · Verifica la firma con el apksigner oficial y compara la huella con la del
#     fichero. Si no coincide, falla en vez de publicar otra cosa.
#   · NO prueba nada en un dispositivo: aquí no hay emulador. Que arranque en el
#     V60 sigue sin confirmarse hasta que alguien lo instale y lo abra.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Arquitectura del APK"
        type: choice
        default: "arm64-v8a"
        options: ["universal", "arm64-v8a", "armeabi-v7a", "x86_64", "x86"]
      publicar:
        description: "Crear la release con el APK y sus sumas"
        type: boolean
        default: true
      etiqueta:
        description: "Etiqueta de la release. Vacía = se deriva del versionName de android/app/build.gradle"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # La nota de la release deriva sus cambios del historial. Con la
          # profundidad por defecto no hay historial ni etiquetas, y la nota
          # volvería a estar escrita a mano, que es como se pudrió la anterior.
          fetch-depth: 0
          fetch-tags: true

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Herramienta oficial de firma
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$BT" ] || [ ! -x "$BT/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" > /dev/null
            BT="$ANDROID_HOME/build-tools/35.0.0"
          fi
          echo "APKSIGNER=$BT/apksigner" >> "$GITHUB_ENV"

      - name: Escribir el keystore desde el secreto
        env:
          CEROX_KEYSTORE_B64: ${{ secrets.CEROX_KEYSTORE_B64 }}
        run: |
          echo "$CEROX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cerox.p12"
          echo "CEROX_KEYSTORE=$RUNNER_TEMP/cerox.p12" >> "$GITHUB_ENV"

      - name: Construir el APK de release, sin modelos
        working-directory: android
        env:
          ABI: ${{ inputs.abi }}
          CEROX_KEYSTORE_PASS: ${{ secrets.CEROX_KEYSTORE_PASS }}
          CEROX_KEY_ALIAS: ${{ secrets.CEROX_KEY_ALIAS }}
          CEROX_KEY_PASS: ${{ secrets.CEROX_KEY_PASS }}
        run: |
          ARGS="-PsinModelos"
          if [ "$ABI" != "universal" ]; then ARGS="$ARGS -PsoloAbi=$ABI"; fi
          # El universal viaja sin el motor ONNX y con los nativos comprimidos:
          # 15,7 MB por arquitectura con cero modelos dentro no se le suben a
          # nadie. El de arm64 conserva el motor para cuando haya modelos.
          if [ "$ABI" = "universal" ]; then ARGS="$ARGS -PsinOnnxNative"; fi
          # R8 se murió con OutOfMemoryError usando el -Xmx2048m de
          # android/gradle.properties. Ese valor no es arbitrario: está medido en
          # una máquina de 2 GiB donde -Xmx1024m revienta y -Xmx1400m se queda sin
          # proceso. Este runner tiene 16 GiB, así que el heap se sube AQUÍ, en la
          # línea de comandos, y el gradle.properties sigue valiendo para la
          # máquina pequeña. Bajarlo convierte un fallo lento en uno silencioso;
          # subirlo sólo aquí no le cuesta nada a nadie.
          HEAP='-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
          echo "Argumentos de Gradle: $ARGS $HEAP"
          bash ./gradlew :app:assembleRelease $ARGS "$HEAP" --console=plain --stacktrace

      - name: Verificar firma, huella y ausencia de modelos
        run: |
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "-- apksigner verify --"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee firma.txt
          ESPERADA="$(cat entorno/HUELLA-CERTIFICADO.txt)"
          OBTENIDA="$(grep -oE 'certificate SHA-256 digest: [0-9a-fA-F]{64}' firma.txt | head -1 | awk '{print tolower($NF)}')"
          echo "huella esperada: $ESPERADA"
          echo "huella obtenida: $OBTENIDA"
          if [ "$OBTENIDA" != "$ESPERADA" ]; then
            echo "::error::El APK no está firmado con el certificado del repo"
            exit 1
          fi
          ONNX="$(unzip -l "$APK" | grep -c '\.onnx$' || true)"
          echo "modelos ONNX dentro del APK: $ONNX"
          if [ "$ONNX" != "0" ]; then
            echo "::error::El APK lleva modelos dentro; eso son los 475 MB de antes"
            exit 1
          fi
          sha256sum "$APK" > sha256sums.txt
          stat -c '%s bytes' "$APK"

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-sin-modelos
          path: |
            android/app/build/outputs/apk/release/*.apk
            sha256sums.txt
            firma.txt
          if-no-files-found: error

      - name: Publicar la release
        if: ${{ inputs.publicar }}
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ inputs.etiqueta }}
          ABI: ${{ inputs.abi }}
        run: |
          if [ -z "$ETIQUETA" ]; then
            # Derivada del versionName y no escrita a mano. El valor por defecto
            # anterior se quedó viejo en cuanto se publicó la versión siguiente,
            # y una release cuya etiqueta no coincide con lo que lleva dentro
            # es peor que ninguna.
            VERSION="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)"
            if [ -z "$VERSION" ]; then
              echo "::error::no se pudo derivar la etiqueta: versionName no encontrado"
              exit 1
            fi
            ETIQUETA="v$VERSION"
            echo "Etiqueta derivada del versionName: $ETIQUETA"
          fi
          ANTERIOR="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$ANTERIOR" ]; then
            # La línea de abajo lleva la sangría del bloque a propósito. En la columna
            # 0 cierra el bloque literal y el flujo deja de ser YAML válido: GitHub lo
            # reporta como un run fallido sin ningún job, que no dice nada útil. Con la
            # sangría del bloque, el mandato la ve en su columna 0, que es lo que
            # necesita la continuación de una cadena entrecomillada.
            CAMBIOS="Cambios desde $ANTERIOR:
          $(git log --oneline --no-decorate "$ANTERIOR"..HEAD | sed 's/^/  · /')"
          else
            CAMBIOS="(no hay una etiqueta anterior en el historial: ésta es la primera)"
          fi
          TAM="$(stat -c%s "$APK")"
          MIB="$(python3 -c "print(f'{$TAM/1048576:.1f}')")"
          SUMA="$(cut -d' ' -f1 sha256sums.txt)"
          NOMBRE="app-$ABI.apk"
          cp "$APK" "$NOMBRE"
          cp sha256sums.txt "sha256sums-$ABI.txt"
          HUELLA_TXT="$(cat entorno/HUELLA-CERTIFICADO.txt)"
          cat > notas.md <<NOTAS
          Build de release construida por .github/workflows/apk.yml en el commit ${GITHUB_SHA}.

          · Arquitectura de este run: $ABI. Esta release acumula un APK por
            arquitectura: cada dispatch con publicar=true sube el suyo con su
            nombre (app-<abi>.apk) y su suma, y no pisa los de los demás runs.
            El universal va sin el motor ONNX; el de arm64 lo conserva.
          · Modelos ONNX dentro: 0. Los cinco módulos pesados se inician al
            pedirlos; los ONNX no van empaquetados.
          · Tamaño: $TAM bytes ($MIB MiB). La 1.0.1 pesó 31.577.211 bytes, y la
            primera build pesó 475.523.392 porque llevaba 378 MiB de modelos ONNX
            y cuatro arquitecturas dentro.
          · SHA-256: $SUMA
          · Certificado: huella $HUELLA_TXT, generado el 2026-11-11. Esta firma
            actualiza en el sitio cualquier instalación firmada con ese mismo
            almacén de claves, o sea la 1.0.1-beta y las que vinieron después.
            La única que NO actualiza es la 1.0.0-beta, cuyo certificado se
            perdió: ésa hay que desinstalarla antes de instalar ésta.

          Qué trae esta build: los commits desde la etiqueta anterior, derivados del
          historial y no escritos a mano. La nota anterior listaba el contenido de
          una versión concreta y se quedó mintiendo en cuanto se publicó la
          siguiente, que es exactamente lo que le acaba de pasar a la frase de la
          instalación vieja.

          $CAMBIOS

          Lo que ninguna build de este flujo trae dentro: listas de canales ni
          fuentes. Las fuentes las instala el usuario desde fuera del APK.

          Lo que esta build NO demuestra: que la app funcione en un teléfono. El
          flujo compila, firma y comprueba bytes; no hay emulador aquí. Ni el
          ecualizador ni la reproducción se han probado en un dispositivo: las
          pruebas que los cubren son de JVM, y una prueba de JVM no abre un DSP ni
          un decodificador de vídeo. Queda por confirmarse instalándolo en el V60.
          NOTAS
          if gh release view "$ETIQUETA" > /dev/null 2>&1; then
            gh release upload "$ETIQUETA" "$NOMBRE" "sha256sums-$ABI.txt" --clobber
            # El cuerpo se refresca con curl contra la API REST y no con gh: el
            # `gh release view --json id` de la primera versión dio 404 en el
            # corte arm64 de la 1.0.5, cuatro segundos después de que el corte
            # universal creara la release, y se llevó por delante un run que ya
            # había subido su APK. El id se resuelve por etiqueta en una llamada.
            REL_ID="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$ETIQUETA" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id") or "")')"
            if [ -n "$REL_ID" ]; then
              curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$REL_ID" | python3 -c 'import io,json,sys; io.open("cuerpo.md","w",encoding="utf-8").write(json.load(sys.stdin).get("body") or "")'
              # count=1 para no tocar el párrafo de historia, que nombra de
              # verdad el commit rojo anterior.
              python3 -c 'import io,os,re; b=io.open("cuerpo.md",encoding="utf-8").read(); b=re.sub(r"en el commit [0-9a-f]{7,40}","en el commit "+os.environ["GITHUB_SHA"],b,count=1); io.open("cuerpo.md","w",encoding="utf-8").write(b); io.open("parche.json","w",encoding="utf-8").write(__import__("json").dumps({"body":b}))'
              curl -sS -o /dev/null -w "cuerpo de la release actualizado: %{http_code}\n" -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d @parche.json "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$REL_ID"
            else
              echo "::warning::no se resolvió el id de $ETIQUETA: los bytes están subidos, el cuerpo no se refrescó"
            fi
          else
            # El título sale de la etiqueta y no está escrito a mano: con la
            # versión anterior aquí ponía «1.0.1-beta» y cualquier etiqueta nueva
            # habría publicado una release que se contradice con su propio nombre.
            gh release create "$ETIQUETA" "$NOMBRE" "sha256sums-$ABI.txt" \
              --target main --title "cero-X ${ETIQUETA#v} ($ABI, sin modelos)" \
              --notes-file notas.md
          fi
          echo "Release $ETIQUETA publicada con $NOMBRE ($TAM bytes)"

      - name: Resumen con los hechos
        if: always()
        run: |
          if [ -n "${APK:-}" ] && [ -f "$APK" ]; then
            echo "APK: $APK"
            echo "bytes: $(stat -c%s "$APK")"
            echo "sha256: $(cut -d' ' -f1 sha256sums.txt)"
            echo "huella: $(cat entorno/HUELLA-CERTIFICADO.txt)"
          else
            echo "No hay APK: la construccion fallo antes de empaquetar."
          fi
