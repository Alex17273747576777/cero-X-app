android.useAndroidX=true
android.nonTransitiveRClass=true
# Medido el 2026-11-08 en esta maquina (1982 MiB de RAM + 2 GiB de swap):
#   -Xmx1024m -> R8: OutOfMemoryError, explicito.
#   -Xmx1400m -> el daemon muere sin mensaje (OOM killer del kernel).
#   -Xmx2048m -> es el valor con el que se construyo el APK de 475 MB. Revertido.
# La leccion: no se baja el heap por debajo de lo que R8 necesita; se le da
# espacio y se deja terminar. Bajar el limite convierte un fallo lento en uno
# silencioso, que es peor.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# 2048m es el techo de ESTA máquina, no el que necesita R8. En CI, donde el runner
# tiene 16 GiB, .github/workflows/apk.yml lo sube a -Xmx6g por línea de comandos:
# con 2 GiB R8 murió de OutOfMemoryError al minificar el release (run 43010008338).
# El valor de aquí no se toca porque en la máquina pequeña es el que funciona.
# PARALELISMO: MEDIDO, NO SUPTUESTO (2026-11-13, tools/medir-build.py, mismo commit y
# mismo cierre completo clean + pruebas + los dos APK; histórico en work/ci/paralelismo.tsv
# y el porqué en docs/PARALELISMO.md):
#   base, caché apagada ................ 225,0 s   pico RSS java 1.759 MB   MemAvailable mínimo 29 MB
#   base + org.gradle.caching .......... 136,7 s   mismos 614/0/14 y MISMO sha256 de los dos APK
#   base + 2 forks + 2 workers + parallel 237,7 s  más lento, y con la máquina en el suelo
# O sea: la caché de build recorta un 39 % y el paralelismo de tareas NO ayuda aquí.
#
# Por qué el paralelismo no ayuda, y no es pereza: settings.gradle incluye UN solo
# subproyecto (:app; el núcleo compartido se compila como carpeta de fuentes, no como
# módulo), así que org.gradle.parallel no tiene un segundo proyecto que ejecutar a la vez
# —activarlo es un placebo—. Y los workers quedan en 1 porque con 2 CPUs y ~2 GiB el
# demonio ya pide -Xmx2048m y cada fork de pruebas su propio heap: un solo cierre completo
# deja MemAvailable en 29 MB, al borde del OOM killer. Subir esto exige volver a medir, y
# subirlo sin medir convierte un build de 137 s en uno de 238 s.
org.gradle.workers.max=1
org.gradle.parallel=false

# Caché de build. Es lo que sí ganó: 225,0 s → 136,7 s en el cierre completo, con los
# mismos recuentos de pruebas y los dos APK byte a byte idénticos (581b2de7ee2e3d6f…),
# que es la comprobación de que reutilizar salidas no cambia el producto. Vive en
# GRADLE_USER_HOME, fuera del workspace, así que no come presupuesto de snapshot; en CI
# la recoge actions/cache porque cachea ~/.gradle/caches.
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# Robolectric baja un jar grande por versión de Android. En el entorno Arena,
# entorno/local.sh fija CEROX_M2_REPO fuera del workspace y el init script
# tools/low-memory.gradle se lo pasa explícitamente al worker de pruebas.
# Fuera de ese entorno se usa el ~/.m2 normal del desarrollador.
