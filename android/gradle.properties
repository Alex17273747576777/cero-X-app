android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# Robolectric baja un jar de 143,67 MiB por version de Android probada. Por
# defecto va a ~/.m2; en este entorno ~ = /home/user, que es lo unico que se
# guarda entre mensajes. Con esto, la cache va a /opt y /home se queda en 13 KB.
# Ver android/gradle.properties.leeme
systemProp.maven.repo.local=/opt/m2
