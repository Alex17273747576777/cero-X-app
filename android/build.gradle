// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        // El módulo `comun` usa kotlinx.serialization en commonMain. Sin esto en el
        // classpath, incluirlo desde Android falla al resolver el plugin.
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.0.21'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Los repositorios se declaran SOLO en settings.gradle (dependencyResolutionManagement),
// que está en modo FAIL_ON_PROJECT_REPOS. Declararlos aquí también rompe la evaluación:
// 'Build was configured to prefer settings repositories over project repositories'.

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}