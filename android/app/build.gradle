plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
    // Room procesa sus anotaciones con KSP, no con kapt.
    // kapt no soporta Kotlin 2.0 (avisa: "Falling back to 1.9") y ademas es
    // 2-3x mas lento porque genera stubs de Java que luego hay que compilar.
    id 'com.google.devtools.ksp' version '2.0.21-1.0.28'
}

android {
    namespace 'com.ceroX.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.ceroX.app"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "1.0.0-beta-kisara-universal"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true

        // APK Universal: todas las arquitecturas en un solo APK
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        // Release: la llave viene del entorno (CI o máquina local), nunca del repo.
        // Sin estas variables el APK sale sin firmar, que es lo correcto.
        release {
            def storePath = System.getenv('CEROX_KEYSTORE')
            if (storePath != null) {
                storeFile file(storePath)
                storePassword System.getenv('CEROX_KEYSTORE_PASS')
                keyAlias System.getenv('CEROX_KEY_ALIAS')
                keyPassword System.getenv('CEROX_KEY_PASS')
            }
        }
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('../debug.keystore')
            storePassword 'android'
        }
    }

    buildTypes {
        release {
            if (System.getenv('CEROX_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
            // Esquemas de firma. Medido el 2026-11-08 con apksigner verify:
            //
            //   v2: true    v3: true    v1: false
            //
            // El comentario anterior decia que v1 hacia falta para Android 8
            // (API 26). **Era falso**: el esquema v2 existe desde Android 7.0
            // (API 24). Con minSdk 26, v2 basta y v1 es redundante. Verificado:
            // v2 y v3 validan el APK; v1 no se aplico aunque se pidiera aqui.
            signingConfigs.release.v1SigningEnabled = true
            signingConfigs.release.v2SigningEnabled = true
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // La firma viene de variables de entorno (CI), nunca de una llave en el repo.
            // Sin ellas, release compila sin firmar; para probar: ./gradlew assembleDebug
            // R8 optimización agresiva para eliminar código muerto
        }
        debug {
            // debug sin minificar: minificar en debug solo retrasa cada compilación
            // y hace las trazas ilegibles, que es justo lo que no se quiere al depurar.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
        freeCompilerArgs = [
            '-opt-in=kotlin.RequiresOptIn',
            '-opt-in=androidx.compose.material.ExperimentalMaterialApi',
            '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi'
        ]
    }

    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }


    // Los modelos ONNX NO se comprimen dentro del APK: el runtime los mapea
    // directamente desde el archivo. Comprimirlos obliga a descomprimir cientos
    // de MB en memoria al abrirlos, que es exactamente lo que tumba a un móvil.
    androidResources {
        noCompress 'onnx'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/services/*'
            excludes += '/META-INF/*.kotlin_module'
            excludes += '/META-INF/*.version'
            excludes += '/META-INF/maven/*'
            excludes += '/META-INF/metadata/*'
            excludes += '/META-INF/*/versions/*'
        }
        jniLibs {
            // Incluir todas las bibliotecas nativas para APK universal
            // ONNX Runtime, OpenCV, etc. para todas las ABI
            excludes += '**/libc++_shared.so'
        }
        // No excluir .so files - necesitamos todas las arquitecturas para universal
        pickFirsts = []
    }

    // Splits deshabilitados para APK universal (un solo APK para todas las arquitecturas)
    splits {
        abi {
            enable false
            universalApk true
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        ignoreWarnings true
        disable 'MissingTranslation', 'InvalidPackage', 'PreciousThreadSleep'
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    // ── Licencia dentro del APK ──────────────────────────────────────────────
    // Apache-2.0 no pide publicar el código, pero SÍ exige que el aviso y el
    // NOTICE lleguen a quien recibe la app. Un NOTICE en el repositorio no
    // cumple: la obligación es sobre lo que se distribuye. Por eso se empaqueta
    // en assets, y LicenseModule lo comprueba leyendo el asset, no el repo.
    androidResources {
        noCompress += ["NOTICE", "LICENSE"]
    }

    // Configuración de tamaño objetivo 200-750 MB para APK universal
    // Incluye: ONNX Runtime (4 arquitecturas), modelos ONNX, bibliotecas nativas, recursos
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Jetpack Compose
    implementation 'androidx.compose.ui:ui:1.7.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.0'
    implementation 'androidx.compose.material3:material3:1.3.0'
    // El código importa 27 iconos que solo existen en el paquete extended.
    // material3 no los trae: sin esta línea, `Icons.<nombre>` no resuelve.
    implementation 'androidx.compose.material:material-icons-extended:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.8.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.0'

    // Room database
    implementation 'androidx.room:room-runtime:2.7.0'
    ksp 'androidx.room:room-compiler:2.7.0'
    implementation 'androidx.room:room-ktx:2.7.0'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.8.0'

    // ONNX Runtime para AI (CPU/NNAPI) - TODAS las arquitecturas para universal
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'

    // Hilt DI

    // Coil para imágenes
    implementation 'io.coil-kt:coil:2.6.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    // Robolectric hace falta para probar Bitmap de verdad: con el
    // returnDefaultValues de Gradle, allocationByteCount devuelve 0 y las
    // pruebas de tamaño pasarían todas sin probar nada.
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
// Robolectric descarga android-all-instrumented (143,67 MiB por versión de
// Android probada) a ~/.m2 por defecto. En este entorno ~ = /home/user, el
// único sitio que se guarda, y una sesión creó 143,7 MB ahí y agotó el espacio.
//
// `systemProp.maven.repo.local` NO funciona: Robolectric 4.13 usa su propio
// resolutor y solo entiende `robolectric.dependency.dir`. Se pasa como propiedad
// de sistema a la JVM de las pruebas, que es donde la lee.
tasks.withType(Test).configureEach {
    systemProperty "robolectric.dependency.dir", "/opt/robolectric"
    systemProperty "maven.repo.local", "/opt/m2"
}


// Copia LICENSE y NOTICE del repo a los assets que van dentro del APK.
// Se engancha a preBuild para que ningún build pueda olvidarse.
// Este build.gradle es Groovy, no Kotlin DSL: `val` no existe aquí. Se usa `def`.
tasks.register("bundleLicenseAssets") {
    def origen = rootProject.projectDir.parentFile
    def destino = file("src/main/assets")
    doLast {
        destino.mkdirs()
        ["LICENSE", "NOTICE"].each { nombre ->
            def src = new File(origen, nombre)
            if (src.exists()) {
                // Se usa Files.copy en vez de File.copyTo: en Groovy, copyTo
                // resuelve `overwrite = true` como propiedad del task y falla.
                java.nio.file.Files.copy(
                    src.toPath(),
                    new File(destino, nombre).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                println("licencia empaquetada: " + nombre + " (" + src.length() + " B)")
            } else {
                // Falla el build: distribuir sin NOTICE incumple Apache-2.0.
                throw new GradleException("Falta " + nombre + " en la raiz del repositorio. " +
                    "Apache-2.0 exige que el NOTICE llegue al usuario final.")
            }
        }
    }
}

tasks.named("preBuild") { dependsOn("bundleLicenseAssets") }
