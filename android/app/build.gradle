plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.serialization'
    // Room procesa sus anotaciones con KSP, no con kapt.
    // kapt no soporta Kotlin 2.0 (avisa: "Falling back to 1.9") y ademas es
    // 2-3x mas lento porque genera stubs de Java que luego hay que compilar.
    id 'com.google.devtools.ksp' version '2.3.13'
}

android {
    namespace 'com.ceroX.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.ceroX.app"
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName "1.0.8-beta-fuentes-verificadas"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true

        // APK Universal: todas las arquitecturas en un solo APK
        //
        // Para la VM de pruebas se puede construir un APK de UNA sola
        // arquitectura con `-PsoloAbi=x86_64`: el universal pesa 475 MB y no
        // cabe en un emulador con 1 GB de RAM.
        ndk {
            abiFilters = project.hasProperty('soloAbi')
                ? [project.property('soloAbi').toString()]
                : ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        }
    }

    signingConfigs {
        // Release: la llave viene del entorno (CI o máquina local), nunca del repo.
        // Sin estas variables el APK sale sin firmar, que es lo correcto.
        release {
            def storePath = System.getenv('CEROX_KEYSTORE')
            if (storePath != null) {
                storeFile file(storePath)
                storePassword System.getenv('CEROX_KEYSTORE_PASS')
                keyAlias System.getenv('CEROX_KEY_ALIAS')
                keyPassword System.getenv('CEROX_KEY_PASS')
            }
        }
        // Debug usa la clave de desarrollo generada por Android, nunca una del repositorio.
    }

    buildTypes {
        release {
            if (System.getenv('CEROX_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
            // Esquemas de firma. Medido el 2026-11-08 con apksigner verify:
            //
            //   v2: true    v3: true    v1: false
            //
            // El comentario anterior decia que v1 hacia falta para Android 8
            // (API 26). **Era falso**: el esquema v2 existe desde Android 7.0
            // (API 24). Con minSdk 26, v2 basta y v1 es redundante. Verificado:
            // v2 y v3 validan el APK; v1 no se aplico aunque se pidiera aqui.
            signingConfigs.release.v1SigningEnabled = true
            signingConfigs.release.v2SigningEnabled = true
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // La firma viene de variables de entorno (CI), nunca de una llave en el repo.
            // Sin ellas, release compila sin firmar; para probar: ./gradlew assembleDebug
            // R8 optimización agresiva para eliminar código muerto
        }
        debug {
            // debug sin minificar: minificar en debug solo retrasa cada compilación
            // y hace las trazas ilegibles, que es justo lo que no se quiere al depurar.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
        freeCompilerArgs = [
            '-opt-in=kotlin.RequiresOptIn',
            '-opt-in=androidx.compose.material.ExperimentalMaterialApi',
            '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi',
            '-Xcontext-parameters'
        ]
    }

    sourceSets {
        // El grano fino de la multicompatibilidad: la app de Android compila los
        // MISMOS archivos que el jar de escritorio (JVM) y el .js de la web.
        //
        // Se declara en el source set `main` de Android. `main.java.srcDirs` es
        // donde el plugin de Kotlin busca los `.kt` de un módulo Android, y las
        // rutas van resueltas con `file()`, no como texto relativo: una ruta
        // relativa depende del directorio desde el que se invoque a Gradle.
        main {
            java.srcDirs += file('../../comun/src/commonMain/kotlin').absolutePath
            java.srcDirs += file('../../comun/src/androidAppMain/kotlin').absolutePath
            // El archivo con `expect` no está en `commonMain`, sino en
            // `commonExpect`, así que aquí no llega y no hace falta excluir nada.
        }
    }

    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
        // El AIDL de Shizuku (moe.shizuku.server) NO se genera aquí: lo trae
        // `dev.rikka.shizuku:aidl`, dependencia transitiva de
        // `dev.rikka.shizuku:api`. Hubo cuatro .aidl copiados a mano en
        // src/main/aidl/moe/shizuku/server y R8 se negó a minificar con la clase
        // definida dos veces. Se compararon antes de quitarlos: mismos códigos de
        // transacción y el artefacto es superconjunto (docs/SHIZUKU-AIDL.md).
        // `Shizuku.newProcess` sigue siendo privado desde la 13, así que el
        // binder se llama por AIDL de todas formas; lo que cambió es de dónde
        // salen las interfaces. El `aidl true` de abajo se queda para el AIDL
        // propio que pueda hacer falta; el de Shizuku ya viene compilado.
        aidl true
    }


    // Los modelos ONNX NO se comprimen dentro del APK: el runtime los mapea
    // directamente desde el archivo. Comprimirlos obliga a descomprimir cientos
    // de MB en memoria al abrirlos, que es exactamente lo que tumba a un móvil.
    androidResources {
        noCompress 'onnx'
        // `-PsinModelos` deja los ONNX fuera del APK. Sirve para probar la
        // interfaz y el lector en la VM: los modelos pesan 378 MiB y no hacen
        // falta para abrir un capítulo de una carpeta local. En un build normal
        // esta propiedad no se pasa y los modelos van dentro.
        if (project.hasProperty('sinModelos')) {
            ignoreAssetsPattern = '!*.onnx'
        }
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/services/*'
            excludes += '/META-INF/*.kotlin_module'
            excludes += '/META-INF/*.version'
            excludes += '/META-INF/maven/*'
            excludes += '/META-INF/metadata/*'
            excludes += '/META-INF/*/versions/*'
        }
        jniLibs {
            // Incluir todas las bibliotecas nativas para APK universal
            // ONNX Runtime, OpenCV, etc. para todas las ABI
            excludes += '**/libc++_shared.so'
        }
        // No excluir .so files - necesitamos todas las arquitecturas para universal
        pickFirsts = []
    }

    // Variante universal sin el motor ONNX: las clases de onnxruntime4j se
    // quedan (pesan kilobytes y son las que dejan que MotorOnnx detecte la
    // ausencia y la diga); los .so, 15,7 MB por arquitectura con cero modelos
    // dentro, no viajan. Se activa con -PsinOnnxNative, que añade el flujo
    // cuando la arquitectura pedida es universal.
    if (project.hasProperty('sinOnnxNative')) {
        packagingOptions {
            jniLibs {
                excludes += '**/libonnxruntime.so'
                excludes += '**/libonnxruntime4j_jni.so'
            }
        }
    }

    // Splits deshabilitados para APK universal (un solo APK para todas las arquitecturas)
    splits {
        abi {
            enable false
            universalApk true
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        ignoreWarnings true
        disable 'MissingTranslation', 'InvalidPackage', 'PreciousThreadSleep'
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        // PackageParser de Android 14 verifica APK mediante DirectByteBuffer;
        // JDK 21 exige abrirlo al arnés Robolectric (no afecta al APK distribuido).
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.nio=ALL-UNNAMED'
        }
    }

    // ── Licencia dentro del APK ──────────────────────────────────────────────
    // La GPL-3.0 exige que el texto de la licencia acompañe a la obra, y el
    // linaje Apache-2.0/MIT exige que el aviso y el NOTICE lleguen a quien
    // recibe la app. Un NOTICE en el repositorio no cumple ninguna de las dos:
    // la obligación es sobre lo que se distribuye. Por eso se empaquetan en
    // assets, y LicenseModule lo comprueba leyendo el asset, no el repo.
    androidResources {
        noCompress += ["NOTICE", "LICENSE"]
    }

    // Configuración de tamaño objetivo 200-750 MB para APK universal
    // Incluye: ONNX Runtime (4 arquitecturas), modelos ONNX, bibliotecas nativas, recursos
}

dependencies {
    // Mismo verificador de firmas que usa la herramienta oficial apksigner.
    implementation 'com.android.tools.build:apksig:8.12.0'
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // El núcleo compartido (comun/) se compila DENTRO de este módulo: su carpeta
    // `src/commonMain` entra como fuente más abajo, en `sourceSets`. Es Kotlin
    // puro sin ninguna dependencia externa, así que compila tal cual. Un solo
    // fuente para Android, escritorio (JVM), web (JS) e iOS.
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Jetpack Compose
    implementation 'androidx.compose.ui:ui:1.7.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.0'
    implementation 'androidx.compose.material3:material3:1.3.0'
    // El código importa 27 iconos que solo existen en el paquete extended.
    // material3 no los trae: sin esta línea, `Icons.<nombre>` no resuelve.
    implementation 'androidx.compose.material:material-icons-extended:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.8.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.0'

    // Room database
    implementation 'androidx.room:room-runtime:2.7.0'
    ksp 'androidx.room:room-compiler:2.7.0'
    implementation 'androidx.room:room-ktx:2.7.0'

    // Motor JavaScript para las extensiones .js. Elegido con numeros medidos:
    // Apache-2.0 como el resto del proyecto, 854 KB en arm64 (frente a 53 MB de
    // j2v8 por ABI), bytecode Java 8 y el mismo motor que usa Mihon.
    // Ver modules/source_js/MotorJs.kt para la comparacion completa.
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'

    // Shizuku: ejecutar `pm install` sin root, con el permiso de ADB.
    // `api` trae el binder; `provider` trae el ContentProvider que Shizuku usa
    // para descubrir la app autorizada. Sin el segundo, el permiso nunca llega.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Cifrado del token de los trackers. EncryptedSharedPreferences deriva la
    // clave del Keystore; sin esto habría que guardar el token en claro, y un
    // token de AniList da acceso a la cuenta entera.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // Runtime alineado con Project Nox/extensions-lib 1.6. MangaDex 1.6.5
    // referencia kotlin.time.Instant, coroutines 1.11 y OkHttp 5: mantener aquí
    // versiones viejas producía un APK que cargaba clases pero fallaba al buscar.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.11.0'
    implementation 'uy.kohesive.injekt:injekt-core:1.16.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.jsoup:jsoup:1.22.2'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // OkHttp 5 y las compression interceptors que KeiSource instala de verdad.
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.squareup.okhttp3:okhttp-brotli:5.4.0'
    implementation 'com.squareup.okhttp3:okhttp-zstd:5.4.0'
    implementation 'com.squareup.okio:okio:3.16.4'

    // Reproductor: media3/ExoPlayer (Apache-2.0, compatible con la GPL-3.0 del
    // proyecto). Hace falta porque el MediaPlayer del framework no resuelve
    // playlists .m3u8, y el IPTV es HLS casi siempre; lo deja dicho VideoModule en
    // su propia documentación. El módulo -hls no es un extra: sin él media3 no
    // reconoce los flujos .m3u8.
    // Versión fija a propósito, y las dos piezas en la misma. Nada de rangos
    // dinámicos ni de resolvedores que elijan la última disponible: cambiarían lo
    // que se compila sin que nadie lo decida. La prueba que vigila esto busca las
    // dos cadenas prohibidas por su nombre, así que este comentario las describe y
    // no las escribe — citarlas aquí sería exactamente el fallo que la prueba caza.
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'

    // ONNX Runtime para AI (CPU/NNAPI) - TODAS las arquitecturas para universal
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'

    // Hilt DI

    // Coil para imágenes
    implementation 'io.coil-kt:coil:2.6.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    // Robolectric hace falta para probar Bitmap de verdad: con el
    // returnDefaultValues de Gradle, allocationByteCount devuelve 0 y las
    // pruebas de tamaño pasarían todas sin probar nada.
    testImplementation 'org.robolectric:robolectric:4.16.1'
    // ONNX Runtime de escritorio: hace falta para ejecutar los modelos en las pruebas
    // y comprobar la forma de su salida. Sin esto, la suite compila el lector de
    // tensores pero nunca lo enfrenta a un modelo, que es justo cómo se colaron el
    // casteo de tres niveles y el tamaño ×4 mal calculado.
    // Es `testImplementation` y no `implementation`: no viaja en el APK.
    testImplementation 'com.microsoft.onnxruntime:onnxruntime:1.17.0'
    testImplementation 'androidx.test:core:1.6.1'
    // Selector semántico real para los accesos Compose bajo Robolectric.
    testImplementation 'androidx.compose.ui:ui-test-junit4:1.7.0'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
// Robolectric descarga android-all-instrumented (143,67 MiB por versión de
// Android probada) a ~/.m2 por defecto. En este entorno ~ = /home/user, el
// único sitio que se guarda, y una sesión creó 143,7 MB ahí y agotó el espacio.
//
// `systemProp.maven.repo.local` NO funciona: Robolectric 4.13 usa su propio
// resolutor y solo entiende `robolectric.dependency.dir`. Se pasa como propiedad
// de sistema a la JVM de las pruebas, que es donde la lee.
tasks.withType(Test).configureEach {
    // Solo se fija si el directorio existe. Antes se fijaba siempre, y en cualquier
    // máquina que no fuera esta —un CI, otro portátil— Robolectric buscaba el jar en
    // /opt/robolectric, no lo encontraba y las 60 pruebas que lo usan fallaban con
    // «Path is not a file». Un rojo de configuración disfrazado de rojo de código.
    def dirRobolectric = file("/opt/robolectric")
    if (dirRobolectric.directory) {
        systemProperty "robolectric.dependency.dir", dirRobolectric.absolutePath
    }
    def dirM2 = file("/opt/m2")
    if (dirM2.directory) {
        systemProperty "maven.repo.local", dirM2.absolutePath
    }

    // Los nombres de archivo se decodifican con el juego de caracteres del
    // entorno. En un contenedor sin locale (LC_CTYPE=POSIX) la JVM los lee como
    // ASCII y «Capítulo» llega como «Cap?tulo»: el lector parece roto cuando el
    // roto es el entorno de compilación. Se fija UTF-8 aquí para que la prueba
    // mida el lector y no la configuración de la máquina.
    // Cuántos procesos de prueba corren a la vez. Por defecto 1, y el valor lo decide
    // la memoria, no los núcleos: con 2 CPUs y ~2 GiB de RAM el demonio de Gradle ya
    // pide -Xmx2048m y cada fork de Robolectric su propio heap (384m vía
    // tools/low-memory.gradle). Medido el 2026-11-13 con tools/medir-build.py en la
    // línea base de un cierre completo: pico de RSS java 1.748 MB y MemAvailable bajó
    // a 33 MB, o sea que un solo build ya corre al borde del OOM killer. Las cifras de
    // las variantes están en work/ci/paralelismo.tsv y la conclusión en
    // docs/PARALELISMO.md. Se sube sin editar este fichero: -PceroxForks=2
    maxParallelForks = (project.findProperty("ceroxForks") ?: "1") as int

    // Las pruebas NO entran en la caché de build, aunque la caché esté activada para todo
    // lo demás (org.gradle.caching=true en gradle.properties). Medido el 2026-11-13: con
    // la caché activada y nada más cambiado, `clean :app:testDebugUnitTest …` terminó en
    // 9,6 s con `> Task :app:testDebugUnitTest FROM-CACHE` — 23× más rápido que la base de
    // 225 s y sin ejecutar UNA sola prueba, porque la caché restauró los XML de resultados.
    // Un cierre de fase así habría dicho «614 pruebas, 0 fallos» sobre unas pruebas que
    // nadie corrió: el verde hueco de la regla 18 con otra cara, y más difícil de ver,
    // porque los XML restaurados tienen mtime nuevo y la comprobación de edad no lo caza.
    // El resto del cierre sí se beneficia de la caché (compilación, recursos, dex).
    outputs.cacheIf { false }

    systemProperty "file.encoding", "UTF-8"
    systemProperty "sun.jnu.encoding", "UTF-8"
    jvmArgs "-Dfile.encoding=UTF-8", "-Dsun.jnu.encoding=UTF-8", "-Duser.language=es", "-Duser.country=DO"
    environment "LC_ALL", "C.UTF-8"
    environment "LANG", "C.UTF-8"

    // Varias pruebas leen ficheros del repositorio que NO son entradas de esta
    // tarea: el build.gradle de la app, LICENSE, NOTICE, README.md, AGENTS.md, los
    // workflows y el lockfile de Kotlin/JS. Gradle sólo vigila el classpath y los
    // fuentes compilados, así que un cambio en ésos deja la tarea UP-TO-DATE y el
    // verde que se lee es de la corrida anterior.
    //
    // Medido el 2026-11-13: añadir un comentario a este mismo build.gradle y volver
    // a lanzar :app:testDebugUnitTest dio BUILD SUCCESSFUL en 2 s sin ejecutar
    // ninguna prueba. Un falso positivo con forma de éxito, que es la peor clase.
    // data/catalogo-unico.json sí se vigilaba solo (cambiarlo re-ejecutó la suite en
    // 36 s), así que esto cubre lo que faltaba sin duplicar lo que ya estaba. Los
    // cierres de fase siguen siendo con `clean`, que no depende de esta declaración.
    inputs.files(
        project.file("build.gradle"),
        rootProject.file("../LICENSE"),
        rootProject.file("../NOTICE"),
        rootProject.file("../README.md"),
        rootProject.file("../AGENTS.md"),
        rootProject.file("../comun/kotlin-js-store/yarn.lock"),
        rootProject.file("../comun/build.gradle.kts"),
        rootProject.file("../.github/workflows/apk.yml"),
        rootProject.file("../.github/workflows/auditoria-publicaciones.yml"),
    ).withPropertyName("ficherosDelRepoQueLeenLasPruebas")
}


// Copia LICENSE y NOTICE del repo a los assets que van dentro del APK.
// Se engancha a preBuild para que ningún build pueda olvidarse.
// Este build.gradle es Groovy, no Kotlin DSL: `val` no existe aquí. Se usa `def`.
tasks.register("bundleLicenseAssets") {
    def origen = rootProject.projectDir.parentFile
    def destino = file("src/main/assets")
    doLast {
        destino.mkdirs()
        ["LICENSE", "NOTICE"].each { nombre ->
            def src = new File(origen, nombre)
            if (src.exists()) {
                // Se usa Files.copy en vez de File.copyTo: en Groovy, copyTo
                // resuelve `overwrite = true` como propiedad del task y falla.
                java.nio.file.Files.copy(
                    src.toPath(),
                    new File(destino, nombre).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                println("licencia empaquetada: " + nombre + " (" + src.length() + " B)")
            } else {
                // Falla el build: distribuir sin estos textos incumple la GPL-3.0
                // (la licencia debe acompañar a la obra) y el Apache-2.0 del linaje
                // (el NOTICE debe llegar a quien recibe la app).
                throw new GradleException("Falta " + nombre + " en la raiz del repositorio. " +
                    "GPL-3.0 y el linaje Apache-2.0 exigen que llegue al usuario final.")
            }
        }
    }
}

tasks.named("preBuild") { dependsOn("bundleLicenseAssets") }
