# Nivel por defecto de las pruebas Robolectric. Sin esto cada clase nueva hereda
# el targetSdk del manifiesto o cae en lo que decida Robolectric, y el proyecto
# pasó meses corriendo en Android 14 (sdk 34) mientras compileSdk era 36.
# Medido con Robolectric 4.16.1: 34, 35 y 36 arrancan; 37 no ("API level 37 is
# not available", UnknownSdk.java:45), aunque el SDK traiga platforms/android-37.2-beta3.
sdk=36
